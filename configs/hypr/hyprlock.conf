general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    # fractional_scaling and immediate_render are not valid in hyprlock (they belong in Hyprland)
}

# Source your colors first (must be at the top)
source = colors/colors.conf

background {
    monitor =
    # Use the exact path that worked before, or the current_wallpaper symlink
    path = /home/matyas/wallpapers/wallhaven-je17z5.png
    # OR try the symlink version if your wallpaper switcher uses it:
    # path = ~/.config/hypr/current_wallpaper

    blur_passes = 3
    blur_size = 2
    brightness = 0.6
    # Extra vibrant options (optional)
    # contrast = 1.3
    # vibrancy = 0.21
}

label {
    monitor =
    text = Hi, $USER
    color = $secondary
    font_size = 20
    font_family = Google Sans Flex
    position = 0, 320
    halign = center
    valign = center
}

# Hours (big)
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = $on_secondary_container
    font_size = 112
    font_family = Google Sans Flex
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000099)
}

# Minutes (big)
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = $on_secondary_container
    font_size = 112
    font_family = Google Sans Flex
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000099)
}

# Day name
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> $(date +'%A') </big></b>"
    color = $secondary
    font_size = 18
    font_family = SF Pro Display
    position = 0, -15
    halign = center
    valign = center
}

# Date (dd Mon)
label {
    monitor =
    text = cmd[update:18000000] echo "<b> $(date +'%d %b') </b>"
    color = $secondary
    font_size = 14
    font_family = SF Pro Display
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    rounding = 22
    outer_color = $source_color
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $secondary
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    font_family = Google Sans Flex
    position = 0, 120
    halign = center
    valign = bottom
    inner_color = rgba(0,0,0,0.4)
    check_color = $on_secondary_container
    fail_color = rgba(ff5555ff)
}
